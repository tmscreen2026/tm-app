name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download Gradle
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.1.4-bin.zip
        unzip -q gradle-8.1.4-bin.zip
        echo "$PWD/gradle-8.1.4/bin" >> $GITHUB_PATH

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: tm-app-debug
        path: app/build/outputs/apk/debug/*.apk
